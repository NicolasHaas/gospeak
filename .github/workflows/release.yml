name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
      image: ${{ steps.meta.outputs.image }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Validate tag and prepare metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          core='(0|[1-9][0-9]*)'
          prerelease='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$RELEASE_TAG" =~ ^v${core}\.${core}\.${core}(-${prerelease}(\.${prerelease})*)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          IMAGE="ghcr.io/${REPOSITORY,,}"
          IMAGE_TAG="${RELEASE_TAG//+/_}"
          if [ "${#IMAGE_TAG}" -gt 128 ]; then
            echo "release tag is too long for a container tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  binaries-linux-windows:
    name: Build Release Binaries (Linux/Windows)
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build all binaries via container
        env:
          VERSION_TAG: ${{ needs.metadata.outputs.version }}
          VERSION_COMMIT: ${{ needs.metadata.outputs.commit }}
          VERSION_DATE: ${{ needs.metadata.outputs.date }}
        run: |
          docker build --target builder -t gospeak-builder -f Containerfile \
            --build-arg VERSION_TAG="$VERSION_TAG" \
            --build-arg VERSION_COMMIT="$VERSION_COMMIT" \
            --build-arg VERSION_DATE="$VERSION_DATE" .
          docker run --rm gospeak-builder /bin/sh -c '
            server_ldd=$(ldd /out/gospeak-server 2>&1) && exit 1
            case "$server_ldd" in
              *"not a dynamic executable"*) ;;
              *) echo "$server_ldd" >&2; exit 1 ;;
            esac
            ldd /out/gospeak-client-lin &&
            x86_64-w64-mingw32-objdump -p /out/gospeak-client-win.exe | grep "DLL Name"
          '
          mkdir -p ./bin
          CONTAINER_ID=$(docker create gospeak-builder)
          docker cp "$CONTAINER_ID:/out/gospeak-server" ./bin/gospeak-server-linux
          docker cp "$CONTAINER_ID:/out/gospeak-server-win.exe" ./bin/gospeak-server-windows.exe
          docker cp "$CONTAINER_ID:/out/gospeak-client-lin" ./bin/gospeak-client-linux
          docker cp "$CONTAINER_ID:/out/gospeak-client-win.exe" ./bin/gospeak-client-windows.exe
          docker rm "$CONTAINER_ID"

      - name: Upload Linux/Windows binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-linux-windows
          path: bin/

  binaries-macos:
    name: Build Release Binaries (macOS)
    runs-on: macos-latest
    needs: metadata
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.4"

      - name: Install system dependencies
        run: brew install portaudio opus pkg-config

      - name: Build client
        env:
          VERSION_TAG: ${{ needs.metadata.outputs.version }}
          VERSION_COMMIT: ${{ needs.metadata.outputs.commit }}
          VERSION_DATE: ${{ needs.metadata.outputs.date }}
        run: |
          mkdir -p ./bin
          go build -tags nolibopusfile \
            -ldflags="-s -w -X github.com/NicolasHaas/gospeak/pkg/version.tag=${VERSION_TAG} -X github.com/NicolasHaas/gospeak/pkg/version.commit=${VERSION_COMMIT} -X github.com/NicolasHaas/gospeak/pkg/version.date=${VERSION_DATE}" \
            -o ./bin/gospeak-client-macos ./cmd/client/
          otool -L ./bin/gospeak-client-macos

      - name: Upload macOS binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-macos
          path: bin/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, binaries-linux-windows, binaries-macos]
    permissions:
      contents: write
    steps:
      - name: Download Linux/Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-linux-windows
          path: bin

      - name: Download macOS binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-macos
          path: bin

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            bin/gospeak-server-linux
            bin/gospeak-server-windows.exe
            bin/gospeak-client-linux
            bin/gospeak-client-windows.exe
            bin/gospeak-client-macos
            bin/checksums-sha256.txt

  container:
    name: Publish Container Image
    runs-on: ubuntu-latest
    needs: [metadata, binaries-linux-windows, binaries-macos]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build server image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION_TAG: ${{ needs.metadata.outputs.version }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image-tag }}
          VERSION_COMMIT: ${{ needs.metadata.outputs.commit }}
          VERSION_DATE: ${{ needs.metadata.outputs.date }}
        run: |
          docker build --target server \
            -t "${IMAGE}:${IMAGE_TAG}" \
            --build-arg VERSION_TAG="$VERSION_TAG" \
            --build-arg VERSION_COMMIT="$VERSION_COMMIT" \
            --build-arg VERSION_DATE="$VERSION_DATE" \
            -f Containerfile .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.image-tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned server image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION_TAG: ${{ needs.metadata.outputs.version }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image-tag }}
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"
          git fetch --force --prune --prune-tags --tags origin
          LATEST_STABLE=
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              LATEST_STABLE="$candidate"
              break
            fi
          done < <(git tag --sort=-v:refname)
          if [ "$VERSION_TAG" = "$LATEST_STABLE" ]; then
            docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
