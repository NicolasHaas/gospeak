# GoSpeak Server example Docker Compose
# Usage: docker compose up -d
#
# On first run, read the admin bootstrap credential from the data volume:
#   docker compose exec gospeak cat /data/bootstrap-admin.token

services:
  gospeak:
    image: ghcr.io/nicolashaas/gospeak:latest
    container_name: gospeak
    ports:
      - "9600:9600"       # TCP/TLS control plane
      - "9601:9601/udp"   # UDP encrypted voice
      - "9603:9603"       # TCP/TLS screen-share plane (used when -screen-share is enabled)
    volumes:
      - gospeak-data:/data
    restart: unless-stopped
    command: ["-open", "-screen-share"]

volumes:
  gospeak-data:
